name: Deploy

on:
  push:
    branches: [main, UI-update]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @takeoff/annotate
        run: npm run build:lib --prefix packages/annotate

      - name: Build client
        run: npm run build --prefix app/client

      - name: TypeScript check
        run: npm run typecheck

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Railway's backboard upload endpoint (`/up`) occasionally returns
      # the CLI a hard 30s timeout under load. The CLI itself doesn't
      # expose a `--timeout` or `--retries` flag, so we wrap it in a
      # small bash retry loop. 5 attempts with exponential backoff
      # (30s, 60s, 120s, 240s) covers most observed outages. The job
      # still fails fast if Railway returns an auth error — the loop
      # only retries when railway exits non-zero AND that's the only
      # signal we have to discriminate transient from permanent.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          attempt=0
          backoff=30
          max_attempts=5
          until railway up --service CodeGuru; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::Railway deploy failed after $max_attempts attempts"
              exit 1
            fi
            echo "::warning::Railway deploy attempt $attempt failed; retrying in ${backoff}s"
            sleep $backoff
            backoff=$((backoff * 2))
          done

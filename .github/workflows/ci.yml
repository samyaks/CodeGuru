name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @takeoff/annotate
        run: npm run build:lib --prefix packages/annotate

      - name: TypeScript check (client)
        run: npm run typecheck

      - name: Build client
        run: npm run build --prefix app/client

      - name: Verify server loads
        working-directory: app
        run: node -e "require('./server/routes/analyze'); require('./server/routes/reviews'); require('./server/routes/takeoff'); require('./server/routes/deploy'); require('./server/routes/projects'); require('./server/routes/build-story'); require('./server/routes/public-story'); require('./server/routes/product-map'); console.log('Server modules OK')"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: typecheck-and-build

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t codeguru:${{ github.sha }} .

      # Smoke test: confirm the image boots and responds to /health.
      # We bypass the default CMD (`migrate.js && app.js`) because
      # migrate.js needs a real Postgres and we don't run one in CI.
      # The dummy DATABASE_URL only has to parse — the pg Pool is lazy
      # and never opens a connection unless someone runs a query, and
      # /health deliberately does not touch the DB. NODE_ENV=test keeps
      # validateEnv() advisory rather than fatal on missing SUPABASE_URL.
      - name: Smoke test container
        run: |
          docker run -d --name codeguru-test \
            -p 3001:3001 \
            -e NODE_ENV=test \
            -e ANTHROPIC_API_KEY=test-key \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:9999/ci \
            codeguru:${{ github.sha }} \
            node server/app.js

          # Retry for up to 30s — cold container startup on shared
          # runners can spend several seconds resolving requires.
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Health check passed on attempt $i"
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed after 30 attempts. Container logs:"
            docker logs codeguru-test || true
            docker stop codeguru-test || true
            exit 1
          fi

          docker stop codeguru-test

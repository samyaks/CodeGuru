name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @takeoff/annotate
        run: npm run build:lib --prefix packages/annotate

      - name: Test @takeoff/cli
        run: npm test --prefix packages/cli

      - name: Test GitHub App access, webhooks and PR verdict
        working-directory: app
        run: >-
          node --test
          server/lib/github-app.test.js
          server/lib/github-client.test.js
          server/services/github-access.test.js
          server/services/github-webhook-manager.test.js
          server/services/v2/shipped-runner.test.js
          server/routes/github-app.test.js
          server/routes/github-webhook.test.js
          server/routes/public-story.test.js
          server/services/verdict/verdict.test.js
          server/services/team/team.test.js
          server/routes/team.test.js
          server/lib/analysis-access.test.js
          server/routes/access-gaps.test.js
          server/services/agreements/agreements.test.js
          server/routes/agreements.test.js
          server/services/drift/drift.test.js
          server/routes/drift.test.js
          server/services/overview/overview.test.js
          server/routes/overview.test.js
          server/services/ask/limits.test.js
          server/lib/anthropic-tracked.test.js
          server/services/code-index/filter.test.js
          server/services/code-index/tar.test.js
          server/services/code-index/extract.test.js
          server/services/code-index/index.test.js
          server/routes/code-index.test.js

      - name: TypeScript check (client)
        run: npm run typecheck

      - name: Build client
        run: npm run build --prefix app/client

      - name: Verify server loads
        working-directory: app
        run: node -e "require('./server/routes/analyze'); require('./server/routes/reviews'); require('./server/routes/takeoff'); require('./server/routes/deploy'); require('./server/routes/projects'); require('./server/routes/build-story'); require('./server/routes/public-story'); require('./server/routes/product-map'); require('./server/routes/github-app'); require('./server/routes/github-webhook'); require('./server/routes/team'); require('./server/routes/invites'); require('./server/lib/memberships'); require('./server/routes/railway'); require('./server/lib/analysis-access'); require('./server/routes/agreements'); require('./server/services/agreements/notify'); require('./server/routes/drift'); require('./server/services/drift'); require('./server/routes/overview'); require('./server/services/overview'); require('./server/services/ask/limits'); require('./server/services/ask/config'); require('./server/lib/model-pricing'); require('./server/services/code-index'); require('./server/routes/code-index'); console.log('Server modules OK')"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: typecheck-and-build

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t codeguru:${{ github.sha }} .

      # Smoke test: confirm the image boots and responds to /health.
      # We bypass the default CMD (`migrate.js && app.js`) because
      # migrate.js needs a real Postgres and we don't run one in CI.
      # The dummy DATABASE_URL only has to parse — the pg Pool is lazy
      # and never opens a connection unless someone runs a query, and
      # /health deliberately does not touch the DB. NODE_ENV=test keeps
      # validateEnv() advisory rather than fatal on missing SUPABASE_URL.
      - name: Smoke test container
        run: |
          docker run -d --name codeguru-test \
            -p 3001:3001 \
            -e NODE_ENV=test \
            -e ANTHROPIC_API_KEY=test-key \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:9999/ci \
            codeguru:${{ github.sha }} \
            node server/app.js

          # Retry for up to 30s — cold container startup on shared
          # runners can spend several seconds resolving requires.
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Health check passed on attempt $i"
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed after 30 attempts. Container logs:"
            docker logs codeguru-test || true
            docker stop codeguru-test || true
            exit 1
          fi

          docker stop codeguru-test
